<main class="min-h-screen bg-slate-50 text-slate-900">
  <header class="border-b border-slate-200 bg-white shadow-sm">
    <div class="mx-auto flex max-w-6xl flex-col gap-4 px-4 py-4 sm:flex-row sm:items-center sm:justify-between">
      <h1 class="inline-flex items-center gap-2 text-2xl font-bold tracking-tight">
        <lucide-angular [img]="titleIcon" [size]="22" />
        Elektroniczny bilet miejski
      </h1>
      <nav class="flex flex-wrap gap-2 text-sm font-medium">
        <a
          routerLink="/login"
          routerLinkActive="bg-slate-900 text-white"
          class="inline-flex items-center gap-2 rounded-md px-3 py-2 text-slate-700 transition hover:bg-slate-100"
        >
          <lucide-angular [img]="loginIcon" [size]="16" />
          Logowanie
        </a>
        <a
          routerLink="/register"
          routerLinkActive="bg-slate-900 text-white"
          class="inline-flex items-center gap-2 rounded-md px-3 py-2 text-slate-700 transition hover:bg-slate-100"
        >
          <lucide-angular [img]="registerIcon" [size]="16" />
          Rejestracja
        </a>
        <a
          routerLink="/offer"
          routerLinkActive="bg-slate-900 text-white"
          class="inline-flex items-center gap-2 rounded-md px-3 py-2 text-slate-700 transition hover:bg-slate-100"
        >
          <lucide-angular [img]="offerIcon" [size]="16" />
          Oferta
        </a>
        <a
          routerLink="/my-tickets"
          routerLinkActive="bg-slate-900 text-white"
          class="inline-flex items-center gap-2 rounded-md px-3 py-2 text-slate-700 transition hover:bg-slate-100"
        >
          <lucide-angular [img]="myTicketsIcon" [size]="16" />
          Moje bilety
        </a>
        <a
          routerLink="/transactions"
          routerLinkActive="bg-slate-900 text-white"
          class="inline-flex items-center gap-2 rounded-md px-3 py-2 text-slate-700 transition hover:bg-slate-100"
        >
          <lucide-angular [img]="transactionsIcon" [size]="16" />
          Transakcje
        </a>
        <a
          routerLink="/inspector/check"
          routerLinkActive="bg-slate-900 text-white"
          class="inline-flex items-center gap-2 rounded-md px-3 py-2 text-slate-700 transition hover:bg-slate-100"
        >
          <lucide-angular [img]="checkIcon" [size]="16" />
          Weryfikacja
        </a>
      </nav>
    </div>
  </header>

  <section class="mx-auto max-w-6xl px-4 py-8">
    <router-outlet />
  </section>
</main>
