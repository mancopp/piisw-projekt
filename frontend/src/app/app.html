<main class="min-h-screen bg-slate-50 text-slate-900">
  <header class="sticky top-0 z-50 border-b border-slate-200 bg-white/90 backdrop-blur-md shadow-sm">
    <div class="mx-auto flex max-w-6xl flex-col gap-4 px-4 py-4 md:flex-row md:items-center md:justify-between">

      <h1 class="inline-flex items-center justify-center md:justify-start gap-2 text-xl sm:text-2xl font-bold tracking-tight">
        <lucide-angular [img]="titleIcon" [size]="22" class="text-indigo-600" />
        Elektroniczny bilet miejski
      </h1>

      @if (authService.isLoggedIn()) {
        <div class="flex flex-col gap-4 md:items-end">

          <nav class="flex flex-wrap justify-center md:justify-end gap-2 text-sm font-medium">
            @for (link of currentLinks; track link.route) {
              <a
                [routerLink]="link.route"
                routerLinkActive="bg-slate-900 text-white shadow-md pointer-events-none"
                #rla="routerLinkActive"
                [class.hover:bg-slate-100]="!rla.isActive"
                [class.text-slate-600]="!rla.isActive"
                class="inline-flex grow sm:grow-0 items-center justify-center gap-2 rounded-md px-3 py-2.5 sm:py-2 transition-all active:scale-95"
              >
                <lucide-angular [img]="link.icon" [size]="16" />
                {{ link.label }}
              </a>
            }
          </nav>

          <div class="flex flex-col sm:flex-row items-center justify-center md:justify-end gap-3 text-sm text-slate-700">
            <span class="w-full sm:w-auto rounded-md bg-slate-100 px-3 py-2 sm:py-1 text-center truncate max-w-[300px]">
              {{ currentUserEmail }} · <span class="font-semibold">{{ roleLabel }}</span>
            </span>
            <button
              type="button"
              (click)="logout()"
              class="w-full sm:w-auto rounded-md border border-slate-300 px-4 py-2 sm:py-1 font-medium text-slate-700 transition hover:bg-rose-50 hover:text-rose-700 hover:border-rose-200 active:scale-95"
            >
              Wyloguj
            </button>
          </div>
        </div>
      }
    </div>
  </header>

  <section class="mx-auto max-w-6xl px-4 py-8">
    <router-outlet />
  </section>
</main>
