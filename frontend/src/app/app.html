<main class="min-h-screen bg-slate-50 text-slate-900">
  <header class="border-b border-slate-200 bg-white shadow-sm">
    <div class="mx-auto flex max-w-6xl flex-col gap-4 px-4 py-4 sm:flex-row sm:items-center sm:justify-between">
      <h1 class="inline-flex items-center gap-2 text-2xl font-bold tracking-tight">
        <lucide-angular [img]="titleIcon" [size]="22" />
        Elektroniczny bilet miejski
      </h1>
      @if (authService.isLoggedIn()) {
        <div class="flex flex-col items-end gap-3">
          <nav class="flex flex-wrap justify-end gap-2 text-sm font-medium">
            @for (link of currentLinks; track link.route) {
              <a
                [routerLink]="link.route"
                routerLinkActive="bg-slate-900 text-white"
                class="inline-flex items-center gap-2 rounded-md px-3 py-2 text-slate-700 transition hover:bg-slate-100"
              >
                <lucide-angular [img]="link.icon" [size]="16" />
                {{ link.label }}
              </a>
            }
          </nav>

          <div class="flex flex-wrap items-center justify-end gap-3 text-sm text-slate-700">
            <span class="rounded-md bg-slate-100 px-3 py-1">
              {{ currentUserEmail }} · {{ roleLabel }}
            </span>
            <button
              type="button"
              (click)="logout()"
              class="rounded-md border border-slate-300 px-3 py-1 font-medium text-slate-700 transition hover:bg-slate-100"
            >
              Wyloguj
            </button>
          </div>
        </div>
      }
    </div>
  </header>

  <section class="mx-auto max-w-6xl px-4 py-8">
    <router-outlet />
  </section>
</main>
