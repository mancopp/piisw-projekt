name: CI

on:
  push:
  pull_request:

jobs:
  docs-and-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify required files
        run: |
          test -f README.md
          test -f TODO.md
          test -f .github/workflows/ci.yml

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run backend tests
        run: |
          if [ -f backend/pom.xml ]; then
            mvn -B -f backend/pom.xml test
          else
            echo "Skipping backend tests: backend/pom.xml not found."
          fi

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          if [ -f frontend/package.json ]; then
            npm ci --prefix frontend
          else
            echo "Skipping frontend install: frontend/package.json not found."
          fi
      - name: Build frontend
        run: |
          if [ -f frontend/package.json ]; then
            npm run build --prefix frontend
          else
            echo "Skipping frontend build: frontend/package.json not found."
          fi
      - name: Run frontend tests
        run: |
          if [ -f frontend/package.json ]; then
            npm run test --prefix frontend -- --watch=false
          else
            echo "Skipping frontend tests: frontend/package.json not found."
          fi
