services:
  postgres:
    image: postgres:16
    container_name: eticket-postgres
    environment:
      POSTGRES_DB: eticket
      POSTGRES_USER: eticket
      POSTGRES_PASSWORD: eticket
    ports:
      - "5432:5432"
    volumes:
      - eticket_postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer:latest
    container_name: eticket-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - postgres

volumes:
  eticket_postgres_data:
