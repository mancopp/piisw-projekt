spring:
  application:
    name: eticket-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/eticket}
    username: ${DB_USER:eticket}
    password: ${DB_PASSWORD:eticket}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}
